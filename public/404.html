<!doctype html>
<html lang="en" data-mode="bounty">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>404 | Shubham Puri</title>
    <!--
      A 404 must never be indexed. Vercel serves this file with a real 404
      status, which is the primary signal, but a crawler that already has the
      URL queued gets told twice.
    -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Deliberately standalone: no bundle, no fonts, no JS. This page exists to
      be correct when something else has already gone wrong, so it must not
      depend on the app booting. The type stack mirrors the site's without
      loading a webfont to do it.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --text: #f0fdf4;
        --muted: #9ca3af;
        --accent: #22d3ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 1rem;
        font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 9vw, 3.5rem);
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      p {
        margin: 0 auto 2rem;
        max-width: 42ch;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border: 1px solid var(--accent);
        border-radius: 6px;
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        transition: background-color 150ms ease, color 150ms ease;
      }
      a:hover,
      a:focus-visible {
        background: var(--accent);
        color: var(--bg);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>No bounty here</h1>
      <p>That page does not exist. Everything worth finding is on the front page.</p>
      <a href="/">Back to the doors</a>
    </main>
  </body>
</html>
